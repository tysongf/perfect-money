name: "04_hostile_state_short"
description: "Repeated AMM spoofing dumps + oracle bribery under low-stake auto-throttling and dynamic yield routing"
duration_hours: 504
shock_hour: 48
round_interval_hours: 6
k_pfc: 1.5
basket_hourly_noise_sigma: 0.0003

peg_controller:
  mode: "patched_decoupled"

amm:
  pm_reserve: 250000.0
  numeraire_reserve: 250000.0
  fee_rate: 0.003

initial_vaults:
  - vault_id: "V_ETH_MAIN"
    owner: "borrower_eth"
    branch: "ETH"
    debt_pm: 300000.0
    initial_cr: 2.50
    borrow_rate_apr: 0.04
    deposit_to_sp_branch: "ETH"
  - vault_id: "V_BTC_MAIN"
    owner: "borrower_btc"
    branch: "BTC"
    debt_pm: 200000.0
    initial_cr: 2.50
    borrow_rate_apr: 0.045
    deposit_to_sp_branch: "BTC"
  - vault_id: "V_INS_INIT"
    owner: "ins_funder"
    branch: "ETH"
    debt_pm: 30000.0
    initial_cr: 2.50
    borrow_rate_apr: 0.05
    deposit_to_insurance: true

agent_numeraire:
  arb: 600000.0
  hostile_state: 150000.0
  cartel_trader: 60000.0
  whistleblower: 20000.0

agent_pm_mints:
  hostile_state: 200000.0
  cartel_trader: 20000.0
  dynamic_staker: 200000.0
  whistleblower: 10000.0

hostile_state:
  enabled: true
  agent_id: "hostile_state"
  start_hour: 48
  end_hour: 240
  dump_interval_hours: 12
  dump_pm_amount: 25000.0

whistleblower:
  enabled: true
  dispute_bond_pm: 5000.0
  deviation_threshold: 0.012

oracle:
  s_min_pm: 1000.0
  dispute_bond_min_pm: 5000.0
  # Deliberately low starting stake (140k PM) -> Low-Stake Auto-Throttling tightens max_epoch_delta
  # and boosts staker fee share toward ~40%, keeping CoC >= 3.0 * PfC while DynamicStakerBot adds lockups
  nodes:
    - node_id: "honest_1"
      stake_pm: 42000.0
      role: "honest"
      is_court_voter: true
    - node_id: "honest_2"
      stake_pm: 36000.0
      role: "honest"
      is_court_voter: true
    - node_id: "honest_dynamic"
      stake_pm: 10000.0
      role: "honest"
      is_court_voter: true
    - node_id: "whistleblower"
      stake_pm: 10000.0
      role: "whistleblower"
      is_court_voter: true
    - node_id: "cartel_core_1"
      stake_pm: 42000.0
      role: "cartel"
      is_court_voter: true

cartel_attack:
  start_hour: 60
  end_hour: 180
  bias_by_asset:
    electricity: 0.08
    oil_gas: 0.08
    grain: 0.08
    metals: 0.08
    housing: 0.08
    datacenter_power: 0.08
