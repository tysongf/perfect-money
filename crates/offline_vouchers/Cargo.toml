[package]
name = "offline_vouchers"
version = "0.1.0"
edition = "2024"
description = "Phase 3 decoupled capped-value offline BLE/NFC P-256 pocket vouchers and settlement bridge"

[dependencies]
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0", features = ["bn254"] }
anyhow = "1.0"
ecdsa = "0.17"
hex = "0.4"
ledger_core = { path = "../ledger_core" }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"

