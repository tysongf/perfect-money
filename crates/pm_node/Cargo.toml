[package]
name = "pm_node"
version = "0.1.0"
edition = "2024"
description = "Phase 4 local stateful HTTP/1.1 node for Perfect Money shielded UTXOs, offline pocket escrow, and encrypted mesh relay"

[dependencies]
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0", features = ["bn254"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
ledger_core = { path = "../ledger_core" }
offline_vouchers = { path = "../offline_vouchers" }
pm_sdk = { path = "../pm_sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"

