[package]
name = "evil_prover_harness"
version = "0.1.0"
edition = "2024"
description = "Stage 2 Evil Prover adversarial test harness attacking compiled circuits against real bb verify"

[dependencies]
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0", features = ["bn254"] }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ledger_core = { path = "../ledger_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"

