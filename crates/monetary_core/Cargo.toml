[package]
name = "monetary_core"
version = "0.1.0"
edition = "2024"
description = "Phase 2 consensus-deterministic fixed-point monetary policy, isolated collateral vaults, Stability Pools, and commit-reveal oracle"

[dependencies]
hex = "0.4"
ledger_core = { path = "../ledger_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0", features = ["bn254"] }
anyhow = "1.0"
pm_sdk = { path = "../pm_sdk" }
tempfile = "3.14"

